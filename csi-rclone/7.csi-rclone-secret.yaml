apiVersion: v1
kind: Secret
metadata:
  name: rclone-secret
  namespace: csi-rclone
type: Opaque
stringData:
  remote: "s3"
  remotePath: "kubernetes/pv_data/volumes"
  s3-provider: "Minio"
  s3-endpoint: "<minio-address>"
  s3-access-key-id: "<minio-sccess-key>"
  s3-secret-access-key: "<minio-secret-key>"
